<!doctype html>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; }
  body {
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
    background:#0b0f16;
    color:#e8edf4;
    position:relative;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  /* một vệt sáng rất nhẹ ở góc, chỉ để mặt phẳng không chết cứng */
  .vignette {
    position:absolute; inset:0;
    background:radial-gradient(1100px 620px at 88% -12%, rgba(88,166,255,.10) 0%, transparent 62%);
  }

  .frame {
    position:relative; height:100%;
    padding:86px 92px 76px;
    display:flex; flex-direction:column;
  }

  .kicker {
    display:flex; align-items:center; gap:13px;
    font-size:19px; font-weight:600;
    letter-spacing:.24em; text-transform:uppercase;
    color:#7d8ea4;
  }
  .kicker .dot { width:8px; height:8px; border-radius:50%; background:#58a6ff; }

  h1 {
    margin-top:46px;
    font-size:88px; line-height:1.06; font-weight:700; letter-spacing:-.028em;
    color:#ffffff;
  }

  .sub {
    margin-top:30px;
    font-size:30px; line-height:1.5; font-weight:400; color:#8fa1b8;
    max-width:760px;
  }

  .tags {
    margin-top:auto;
    display:flex; align-items:center; gap:18px;
    font-size:21px; color:#7d8ea4; letter-spacing:.01em;
  }
  .tags .sep { color:#39465a; font-size:16px; }

  .rule { margin-top:34px; height:1px; background:#1d2735; }

  .foot {
    margin-top:28px;
    display:flex; align-items:baseline; justify-content:space-between;
    font-size:23px;
  }
  .foot .site { color:#e8edf4; font-weight:650; letter-spacing:.005em; }
  .foot .note { color:#66768c; letter-spacing:.05em; }
</style>

<div class="vignette"></div>

<div class="frame">
  <div class="kicker"><span class="dot"></span> Blog series</div>

  <h1>AI cho kỹ sư nhúng</h1>

  <div class="sub">
    Những điều mình học được khi tìm hiểu AI<br>từ góc nhìn Embedded.
  </div>

  <div class="tags">
    <span>Embedded</span><span class="sep">•</span>
    <span>Linux</span><span class="sep">•</span>
    <span>Transformer</span><span class="sep">•</span>
    <span>LLM</span><span class="sep">•</span>
    <span>Inference</span>
  </div>

  <div class="rule"></div>

  <div class="foot">
    <span class="site">fanning.vn</span>
    <span class="note">Engineering Notes</span>
  </div>
</div>
