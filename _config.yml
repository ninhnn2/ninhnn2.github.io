title: Fanning
description: Embedded Linux Blog, lập trình nhúng, Linux kernel, device driver, Yocto, Android BSP, IoT và AI cho kỹ sư nhúng

url: "https://fanning.vn"
baseurl: ""
repository: ninhnn2/ninhnn2.github.io

lang: vi
timezone: Asia/Ho_Chi_Minh

# Năm bắt đầu blog — hiển thị trong copyright ở footer
since: 2021-01-01

# Ảnh mặc định khi chia sẻ trang lên mạng xã hội (og:image / twitter:image)
og_image: /assets/images/og-image.jpg

debug:
  compress: true
  dist: false
  shortcodes: true

readme_index:
  with_frontmatter: true

plugins:
  - jemoji
  - jekyll-avatar
  - jekyll-mentions
  - jekyll-github-metadata

# Bản dịch chuỗi giao diện của theme
translate:
  search_docs: Tìm kiếm bài viết...
  search: Tìm kiếm
  searching: Đang tìm kiếm
  search_results: Kết quả tìm kiếm
  search_results_found: "Tìm thấy # kết quả phù hợp"
  search_results_not_found: Không tìm thấy kết quả nào. Hãy thử từ khóa khác.
  previous: Trang trước
  next: Trang sau
  revision: '· phiên bản'
  edit: Sửa trang này trên GitHub
  not_found: Không tìm thấy trang bạn yêu cầu.
  homepage: Trang chủ
  download: Tải xuống
  note: Ghi chú
  tip: Mẹo
  warning: Cảnh báo
  danger: Nguy hiểm
  visits: lượt xem
  visits_page: lượt xem trang này

# Google
google:
  adsense: ca-pub-2950224298461248

# GoatCounter — đếm truy cập, không cookie nên không cần banner đồng ý.
# Giá trị là phần subdomain của dashboard: fanning.goatcounter.com -> "fanning".
# Để trống thì toàn bộ phần đếm biến mất lúc build: không script, không request,
# không khối số ở footer.
# Muốn số đếm hiện ra cho người đọc thì vào Settings của GoatCounter bật
# "Allow adding visitor counts to your website"; chưa bật thì vẫn đếm bình
# thường, chỉ là footer không hiện số.
goatcounter: fanning

exclude:
  - CNAME
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - git_push.sh
  - git_remote_clean.sh
  - git_remote_push.sh
