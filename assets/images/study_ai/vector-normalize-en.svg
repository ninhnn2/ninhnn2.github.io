<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 372" width="620" height="372" role="img" aria-label="Normalize: drop the magnitude, keep the direction"><title>Normalize: drop the magnitude, keep the direction</title><style>
  :root{--bg:#ffffff;--grid:#e6eaef;--axis:#9aa5b1;--ink:#1f2937;--muted:#6b7280;
        --a:#0366d6;--b:#57606a;--par:#1a7f37;--perp:#cf222e;--fill:#0366d612}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0d1117;--grid:#1c2330;--axis:#54606f;--ink:#e6edf3;--muted:#9198a1;
          --a:#58a6ff;--b:#8b949e;--par:#3fb950;--perp:#ff7b72;--fill:#58a6ff1a}
  }
  .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1.5}
  .lbl{font:500 15px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}
  .sm{font:400 13px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--muted)}
  .tick{font:400 11px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--muted)}
  .va{stroke:var(--a);stroke-width:2.6;fill:none}
  .vb{stroke:var(--b);stroke-width:2.6;fill:none}
  .vpar{stroke:var(--par);stroke-width:3;fill:none}
  .vperp{stroke:var(--perp);stroke-width:2.6;fill:none}
  .dash{stroke:var(--perp);stroke-width:1.4;stroke-dasharray:5 4;fill:none;opacity:.75}
  .ray{stroke:var(--b);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55;fill:none}
  .ta{fill:var(--a)} .tb{fill:var(--b)} .tpar{fill:var(--par)} .tperp{fill:var(--perp)}
</style><defs><marker id="ara" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--a)"/></marker><marker id="arb" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--b)"/></marker><marker id="arp" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--par)"/></marker><marker id="arq" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--perp)"/></marker></defs><rect class="bg" width="620" height="372"/><line class="grid" x1="126" y1="8" x2="126" y2="364"/><line class="grid" x1="190" y1="8" x2="190" y2="364"/><line class="grid" x1="254" y1="8" x2="254" y2="364"/><line class="grid" x1="318" y1="8" x2="318" y2="364"/><line class="grid" x1="382" y1="8" x2="382" y2="364"/><line class="grid" x1="8" y1="292" x2="612" y2="292"/><line class="grid" x1="8" y1="228" x2="612" y2="228"/><line class="grid" x1="8" y1="164" x2="612" y2="164"/><line class="grid" x1="8" y1="100" x2="612" y2="100"/><line class="axis" x1="8" y1="292" x2="612" y2="292"/><line class="axis" x1="126" y1="8" x2="126" y2="364"/><circle cx="126" cy="292" r="64" fill="none" stroke="var(--axis)" stroke-width="1.3" stroke-dasharray="5 4"/><line class="ray" x1="126" y1="292" x2="284.3919189857867" y2="133.60808101421335"/><line class="vb" x1="126" y1="292" x2="264.0272436876141" y2="153.9727563123859" marker-end="url(#arb)"/><line class="va" x1="126" y1="292" x2="196.14499269370552" y2="221.85500730629448" marker-end="url(#ara)"/><line class="vpar" x1="126" y1="292" x2="171.25483399593904" y2="246.74516600406096" marker-end="url(#arp)"/><circle cx="196.14499269370552" cy="221.85500730629448" r="3.6" class="ta"/><circle cx="264.0272436876141" cy="153.9727563123859" r="3.6" class="tb"/><circle cx="171.25483399593904" cy="246.74516600406096" r="3.6" class="tpar"/><text x="276.0272436876141" y="157.9727563123859" class="lbl" text-anchor="start">b = k · a   (k > 1)</text><text x="208.14499269370552" y="237.85500730629448" class="lbl" text-anchor="start">a</text><text x="185.25483399593904" y="266.74516600406093" class="lbl" text-anchor="start">a/‖a‖ = b/‖b‖</text><text x="196" y="286" class="sm" text-anchor="start">‖v‖ = 1</text><text x="116" y="310" class="sm" text-anchor="end">O</text><text x="606" y="318" class="sm" text-anchor="end">a and b share a direction, differ in magnitude</text><text x="606" y="338" class="sm" text-anchor="end">divide by ‖v‖ and both land on ONE point</text><text x="606" y="358" class="sm" text-anchor="end">on the unit circle: only direction is left</text></svg>