<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" width="620" height="380" role="img" aria-label="Dot product và góc giữa hai vector"><title>Dot product và góc giữa hai vector</title><style>
  :root{--bg:#ffffff;--grid:#e6eaef;--axis:#9aa5b1;--ink:#1f2937;--muted:#6b7280;
        --a:#0366d6;--b:#57606a;--par:#1a7f37;--perp:#cf222e;--fill:#0366d612}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0d1117;--grid:#1c2330;--axis:#54606f;--ink:#e6edf3;--muted:#9198a1;
          --a:#58a6ff;--b:#8b949e;--par:#3fb950;--perp:#ff7b72;--fill:#58a6ff1a}
  }
  .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1}
  .axis{stroke:var(--axis);stroke-width:1.5}
  .lbl{font:500 15px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}
  .sm{font:400 13px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--muted)}
  .tick{font:400 11px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--muted)}
  .va{stroke:var(--a);stroke-width:2.6;fill:none}
  .vb{stroke:var(--b);stroke-width:2.6;fill:none}
  .vpar{stroke:var(--par);stroke-width:3;fill:none}
  .vperp{stroke:var(--perp);stroke-width:2.6;fill:none}
  .dash{stroke:var(--perp);stroke-width:1.4;stroke-dasharray:5 4;fill:none;opacity:.75}
  .ray{stroke:var(--b);stroke-width:1.2;stroke-dasharray:4 4;opacity:.55;fill:none}
  .ta{fill:var(--a)} .tb{fill:var(--b)} .tpar{fill:var(--par)} .tperp{fill:var(--perp)}
</style><defs><marker id="ara" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--a)"/></marker><marker id="arb" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--b)"/></marker><marker id="arp" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--par)"/></marker><marker id="arq" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="7.5" markerHeight="6" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="var(--perp)"/></marker></defs><rect class="bg" width="620" height="380"/><line class="grid" x1="72" y1="8" x2="72" y2="372"/><line class="grid" x1="142" y1="8" x2="142" y2="372"/><line class="grid" x1="212" y1="8" x2="212" y2="372"/><line class="grid" x1="282" y1="8" x2="282" y2="372"/><line class="grid" x1="352" y1="8" x2="352" y2="372"/><line class="grid" x1="422" y1="8" x2="422" y2="372"/><line class="grid" x1="8" y1="324" x2="612" y2="324"/><line class="grid" x1="8" y1="254" x2="612" y2="254"/><line class="grid" x1="8" y1="184" x2="612" y2="184"/><line class="grid" x1="8" y1="114" x2="612" y2="114"/><line class="grid" x1="8" y1="44" x2="612" y2="44"/><line class="axis" x1="8" y1="324" x2="612" y2="324"/><line class="axis" x1="72" y1="8" x2="72" y2="372"/><line class="vb" x1="72" y1="324" x2="352" y2="184" marker-end="url(#arb)"/><line class="va" x1="72" y1="324" x2="142" y2="114" marker-end="url(#ara)"/><path d="M85.7 282.8 A43.4 43.4 0 0 1 110.8 304.6" fill="none" stroke="var(--muted)" stroke-width="1.4"/><path d="M87.5 277.5 A49.0 49.0 0 0 1 115.8 302.1" fill="none" stroke="var(--muted)" stroke-width="1.4"/><text x="134" y="102" class="lbl" text-anchor="end">a = (1, 3)</text><text x="362" y="190" class="lbl" text-anchor="start">b = (4, 2)</text><text x="107.77597934127819" y="268.53874325018205" class="sm" text-anchor="start">θ = 45°</text><text x="62" y="342" class="sm" text-anchor="end">O</text><text x="142" y="340" class="tick" text-anchor="middle">1</text><text x="212" y="340" class="tick" text-anchor="middle">2</text><text x="282" y="340" class="tick" text-anchor="middle">3</text><text x="352" y="340" class="tick" text-anchor="middle">4</text><text x="422" y="340" class="tick" text-anchor="middle">5</text><text x="64" y="258" class="tick" text-anchor="end">1</text><text x="64" y="188" class="tick" text-anchor="end">2</text><text x="64" y="118" class="tick" text-anchor="end">3</text><text x="64" y="48" class="tick" text-anchor="end">4</text><text x="606" y="26" class="sm" text-anchor="end">a · b = Σ aᵢbᵢ = 1·4 + 3·2 = 10</text><text x="606" y="46" class="sm" text-anchor="end">‖a‖ · ‖b‖ · cos θ = √10 · √20 · cos 45° = 10</text><text x="606" y="66" class="sm" text-anchor="end">hai vế bằng nhau, đó là cả ý nghĩa của dot product</text></svg>