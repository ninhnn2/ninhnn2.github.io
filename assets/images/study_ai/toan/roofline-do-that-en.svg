<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Roofline: why the rung that reads FEWER bytes runs slower"><title>Roofline: why the rung that reads FEWER bytes runs slower</title><style>
