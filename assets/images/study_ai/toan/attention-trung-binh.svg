<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430" role="img" aria-label="Attention là điểm trung bình có trọng số của các vector Value"><title>Attention là điểm trung bình có trọng số của các vector Value</title><style>
  :root{--bg:#ffffff;--grid:#e6eaef;--axis:#9aa5b1;--ink:#1f2937;--muted:#6b7280;
        --a:#0366d6;--b:#8250df;--c:#1a7f37;--d:#cf222e;--e:#bf8700;
