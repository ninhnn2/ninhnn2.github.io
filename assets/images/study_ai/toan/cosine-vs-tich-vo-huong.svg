<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Cùng một cặp từ, hai cách đo cho hai thứ hạng khác nhau"><title>Cùng một cặp từ, hai cách đo cho hai thứ hạng khác nhau</title><style>
  :root{--bg:#ffffff;--grid:#e6eaef;--axis:#9aa5b1;--ink:#1f2937;--muted:#6b7280;
        --a:#0366d6;--b:#8250df;--c:#1a7f37;--d:#cf222e;--e:#bf8700;
        --fill:#0366d612;--fill2:#8250df14}
  @media (prefers-color-scheme: dark){
    :root{--bg:#0d1117;--grid:#1c2330;--axis:#54606f;--ink:#e6edf3;--muted:#9198a1;
          --a:#58a6ff;--b:#bc8cff;--c:#3fb950;--d:#ff7b72;--e:#d29922;
          --fill:#58a6ff1a;--fill2:#bc8cff1a}
  }
  .bg{fill:var(--bg)} .grid{stroke:var(--grid);stroke-width:1;fill:none}
  .axis{stroke:var(--axis);stroke-width:1.5}
  .ttl{font:600 16px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}
  .lbl{font:500 14px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--ink)}
  .sm{font:400 12.5px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--muted)}
  .tick{font:400 11px -apple-system,'Helvetica Neue',Arial,sans-serif;fill:var(--muted)}
  .mono{font:400 12px ui-monospace,'SF Mono',Menlo,monospace;fill:var(--ink)}
  .va{stroke:var(--a);stroke-width:2.6;fill:none}
  .vb{stroke:var(--b);stroke-width:2.6;fill:none}
  .vc{stroke:var(--c);stroke-width:2.6;fill:none}
  .vd{stroke:var(--d);stroke-width:2.4;fill:none}
  .ve{stroke:var(--e);stroke-width:2.4;fill:none}
  .dash{stroke:var(--d);stroke-width:1.4;stroke-dasharray:5 4;fill:none;opacity:.8}
  .dashm{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 4;fill:none;opacity:.6}
  .ta{fill:var(--a)} .tb{fill:var(--b)} .tc{fill:var(--c)} .td{fill:var(--d)} .te{fill:var(--e)}
  .arcline{stroke:var(--muted);stroke-width:1.3;fill:none;opacity:.85}
