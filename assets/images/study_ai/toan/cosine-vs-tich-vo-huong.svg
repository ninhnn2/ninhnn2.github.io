ass="sm" text-anchor="start">45.3°</text><text x="208.3" y="293.0" class="lbl ta" text-anchor="start">cat</text><text x="179.2" y="189.0" class="lbl tb" text-anchor="start">dog</text><text x="78.0" y="322.0" class="mono ta" text-anchor="start">‖cat‖ = 0.8086</text><text x="78.0" y="340.0" class="mono tb" text-anchor="start">‖dog‖ = 0.8733</text><text x="78.0" y="366.0" class="mono" text-anchor="start">tích vô hướng = 0.4970</text><text x="78.0" y="384.0" class="mono" text-anchor="start">cosine = 0.7038</text><path d="M545.5 288.0 A37.5 37.5 0 0 0 508.0 250.5" class="grid"/><path d="M583.0 288.0 A75.0 75.0 0 0 0 508.0 213.0" class="grid"/><path d="M620.5 288.0 A112.5 112.5 0 0 0 508.0 175.5" class="grid"/><path d="M658.0 288.0 A150.0 150.0 0 0 0 508.0 138.0" class="grid"/><path d="M508.0 288.0 L808.0 288.0" class="axis"/><path d="M508.0 288.0 L508.0 78.0" class="axis"/><path d="M508.0 288.0 L664.9 288.0" class="va" marker-end="url(#ara)"/><path d="M508.0 288.0 L598.3 172.4" class="vb" marker-end="url(#arb)"/><path d="M552.0 288.0 A44 44 0 0 0 535.1 253.3" class="arcline"/><text x="558.0" y="274.0" class="sm" text-anchor="start">52.0°</text><text x="673.9" y="293.0" class="lbl ta" text-anchor="start">happy</text><text x="607.3" y="166.4" class="lbl tb" text-anchor="start">sad</text><text x="508.0" y="322.0" class="mono ta" text-anchor="start">‖happy‖ = 1.0462</text><text x="508.0" y="340.0" class="mono tb" text-anchor="start">‖sad‖ = 0.9777</text><text x="508.0" y="366.0" class="mono" text-anchor="start">tích vô hướng = 0.6299</text><text x="508.0" y="384.0" class="mono" text-anchor="start">cosine = 0.6158</text><text x="20.0" y="452.0" class="sm" text-anchor="start">happy và sad là hai vector DÀI hơn, nên tích vô hướng của chúng lớn hơn</text></svg>