<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" role="img" aria-label="Chuẩn hoá: ba vector khác độ dài về chung một đường tròn"><title>Chuẩn hoá: ba vector khác độ dài về chung một đường tròn</title><style>
  :root{--bg:#ffffff;--grid:#e6eaef;--axis:#9aa5b1;--ink:#1f2937;--muted:#6b7280;
        --a:#0366d6;--b:#8250df;--c:#1a7f37;--d:#cf222e;--e:#bf8700;
        --fill:#0366d612;--fill2:#8250df14}
